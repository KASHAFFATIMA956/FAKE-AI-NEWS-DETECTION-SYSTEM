<!DOCTYPE html>
<html>
<head>
    <title>AI Fake News Detector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
        }
        .main-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 8px 32px rgba(0,0,0,0.3);
        }
        textarea, input {
            background: rgba(255,255,255,0.1) !important;
            color: white !important;
            border: none !important;
        }
        textarea::placeholder, input::placeholder {
            color: #ccc !important;
        }
        table { color: white !important; }
        .navbar { background: rgba(0,0,0,0.6) !important; backdrop-filter: blur(8px);}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">AI News Detector</a>
    <div>
      <a href="/" class="btn btn-outline-light btn-sm">Home</a>
      <a href="/dashboard" class="btn btn-outline-info btn-sm">Dashboard</a>
      <a href="/history" class="btn btn-outline-warning btn-sm">History</a>
      <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
  </div>
</nav>
<div class="container mt-5">
    {% block content %}{% endblock %}
</div>
</body>
</html>
