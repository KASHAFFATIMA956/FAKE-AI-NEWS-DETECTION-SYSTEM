{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-10">
    <div class="main-card text-center">
      <h2 class="mb-5">Dashboard Overview</h2>
      <div class="row">
        <div class="col-md-4 mb-3">
          <div class="p-4 bg-dark rounded">
            <h5>Total Checked</h5>
            <h2>{{ total }}</h2>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="p-4 bg-success rounded">
            <h5>Real News</h5>
            <h2>{{ real }}</h2>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="p-4 bg-danger rounded">
            <h5>Fake News</h5>
            <h2>{{ fake }}</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
