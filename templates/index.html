{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="main-card text-center">
      <h2 class="mb-4">Analyze News with AI</h2>
      <form action="/predict" method="POST">
        <textarea name="news" rows="6" class="form-control mb-4" placeholder="Paste news article here..." required></textarea>
        <button type="submit" class="btn btn-primary w-100">Analyze Now</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
