{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="main-card">
      <h2 class="text-center mb-4">User Login</h2>
      <form method="POST">
        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-light w-100">Login</button>
      </form>
      <hr class="my-4">
      <h5 class="text-center">Create Account</h5>
      <form action="/register" method="POST">
        <input type="text" name="username" class="form-control mb-2" placeholder="New Username" required>
        <input type="password" name="password" class="form-control mb-2" placeholder="New Password" required>
        <button type="submit" class="btn btn-warning w-100">Register</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
